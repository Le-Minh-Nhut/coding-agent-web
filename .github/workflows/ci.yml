name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck every package
        run: pnpm -r typecheck

      # Unit, integration and protocol/component tests. This tier must stay free:
      # it spawns no agent and spends no provider credits.
      - name: Tests (unit, integration, web)
        run: npx vitest run

      # The browser client is a build artifact the relay serves, and its build is
      # not a formality: a regression here ships an off-origin asset or a broken UI.
      - name: Build vendored guest client
        run: node scripts/build-guest.mjs

      - name: Build web app
        run: pnpm --filter @caw/web build

      - name: Assert no off-origin assets in the shipped bundles
        run: |
          set -eu
          if grep -rIl "um\.can\.ac\|my\.omp\.sh" apps/web/dist packages/guest/dist; then
            echo "::error::A shipped bundle references a third-party or upstream origin."
            exit 1
          fi
          echo "bundles clean"

      - name: Build server
        run: pnpm --filter @caw/server build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # E2E drives the real server with hermetic state. It launches no LLM-backed
      # agent: the harness pre-seeds the project and conversation it asserts on.
      - name: Browser E2E (Chromium, mobile viewport)
        run: npx playwright test --project=chromium
        env:
          CI: "true"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Real-OMP compatibility is opt-in and manual-only; it launches agents and may spend provider credits.
  compat:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Keep compatibility checks on the repository's verified OMP 18.12.2 baseline.
      - name: Install pinned OMP 18.12.2
        run: |
          set -euo pipefail
          if ! curl -fsSL https://omp.sh/install | bash -s -- --binary --ref v18.12.2; then
            echo "::error::Failed to install OMP v18.12.2."
            exit 1
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          omp_version="$(omp --version)" || {
            echo "::error::Installed OMP v18.12.2 is not runnable."
            exit 1
          }
          echo "Installed $omp_version"
          if [ "$omp_version" != "omp/18.12.2" ]; then
            echo "::error::Expected OMP v18.12.2, got: $omp_version"
            exit 1
          fi

      - name: Machine capability probe (spawns nothing)
        run: node scripts/compat-check.mjs

      - name: Real-OMP compatibility suite
        run: CAW_COMPAT=1 npx vitest run tests/compat
