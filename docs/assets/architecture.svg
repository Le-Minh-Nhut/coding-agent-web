<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Coding Agent Web architecture: phone, tailnet TLS, server tiers, loopback relay, tmux-hosted OMP agents">
  <style>
    .box { fill: var(--surface); stroke: var(--border); stroke-width: 1.5; rx: 8; }
    .label { fill: var(--fg); font: 600 14px ui-sans-serif, system-ui, sans-serif; }
    .sub { fill: var(--muted); font: 12px ui-sans-serif, system-ui, sans-serif; }
    .small { fill: var(--muted); font: 11px ui-monospace, monospace; }
    .arrow { stroke: var(--muted); stroke-width: 1.5; fill: none; marker-end: url(#ah); }
    .arrow-accent { stroke: var(--accent); stroke-width: 2; fill: none; marker-end: url(#aha); }
    .zone { fill: none; stroke: var(--border); stroke-width: 1; stroke-dasharray: 5 4; rx: 10; }
    .zonelabel { fill: var(--muted); font: 600 11px ui-sans-serif, system-ui, sans-serif; letter-spacing: .06em; }
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9" fill="none" stroke="var(--muted)" stroke-width="1.5" />
    </marker>
    <marker id="aha" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9" fill="none" stroke="var(--accent)" stroke-width="2" />
    </marker>
  </defs>

  <!-- phone -->
  <rect class="box" x="30" y="42" width="200" height="96" />
  <text class="label" x="48" y="72">iPhone — Safari / PWA</text>
  <text class="sub" x="48" y="94">controller only</text>
  <text class="small" x="48" y="116">session cookie (__Host-)</text>

  <!-- tailnet -->
  <rect class="zone" x="262" y="30" width="150" height="120" />
  <text class="zonelabel" x="276" y="52">TAILNET</text>
  <text class="sub" x="276" y="74">Tailscale Serve</text>
  <text class="small" x="276" y="94">TLS termination</text>
  <text class="small" x="276" y="110">phone → laptop only</text>
  <text class="small" x="276" y="126">no public port</text>

  <path class="arrow" d="M230 90 L 258 90" />
  <path class="arrow" d="M412 90 L 440 90" />

  <!-- server -->
  <rect class="zone" x="440" y="18" width="490" height="500" />
  <text class="zonelabel" x="456" y="40">CODING AGENT WEB — 127.0.0.1</text>

  <!-- http api -->
  <rect class="box" x="462" y="56" width="200" height="120" />
  <text class="label" x="480" y="82">HTTP API</text>
  <text class="small" x="480" y="104">auth · projects · browse</text>
  <text class="small" x="480" y="120">conversations · runtime</text>
  <text class="small" x="480" y="142">zod-validated at the edge</text>
  <text class="small" x="480" y="158">path policy on every read</text>

  <!-- runtime supervisor -->
  <rect class="box" x="692" y="56" width="222" height="120" />
  <text class="label" x="710" y="82">Runtime supervisor</text>
  <text class="small" x="710" y="104">state machine · ownership</text>
  <text class="small" x="710" y="120">reconciliation · limits</text>
  <text class="small" x="710" y="142">lease probe before launch</text>
  <text class="small" x="710" y="158">the fork guard</text>

  <path class="arrow" d="M662 116 L 688 116" />

  <!-- store -->
  <rect class="box" x="462" y="200" width="200" height="96" />
  <text class="label" x="480" y="226">Metadata store</text>
  <text class="small" x="480" y="248">projects · conversations</text>
  <text class="small" x="480" y="264">events (seq) · command keys</text>
  <text class="small" x="480" y="284">append-only</text>

  <!-- relay -->
  <rect class="box" x="692" y="200" width="222" height="96" />
  <text class="label" x="710" y="226">Collab relay</text>
  <text class="small" x="710" y="248">content-blind: sealed frames</text>
  <text class="small" x="710" y="264">sees room ids + sizes only</text>
  <text class="small" x="710" y="284">serves the guest client</text>

  <path class="arrow" d="M662 248 L 688 248" />
  <path class="arrow-accent" d="M600 176 L 600 196" />

  <!-- agent tier -->
  <rect class="box" x="462" y="330" width="452" height="76" />
  <text class="label" x="480" y="356">tmux-managed OMP agents</text>
  <text class="small" x="480" y="378">one writer per native session · addressed by #{session_id}, never by name</text>
  <text class="small" x="480" y="394">attach from terminal: tmux -S &lt;stateDir&gt;/tmux.sock attach -t $N</text>

  <path class="arrow" d="M803 296 L 803 326" />
  <path class="arrow" d="M600 296 L 600 326" />

  <!-- session store -->
  <rect class="box" x="462" y="432" width="452" height="72" />
  <text class="label" x="480" y="458">Native OMP session journals</text>
  <text class="small" x="480" y="480">~/.omp/agent/sessions/&lt;bucket&gt;/&lt;ts&gt;_&lt;uuidv7&gt;.jsonl</text>
  <text class="small" x="480" y="496">writer lease: abstract socket in /proc/net/unix</text>

  <path class="arrow" d="M688 406 L 688 428" />

  <!-- terminal continuity -->
  <rect class="box" x="30" y="330" width="340" height="76" />
  <text class="label" x="48" y="356">Ubuntu terminal</text>
  <text class="small" x="48" y="378">attaches to the SAME process the</text>
  <text class="small" x="48" y="394">phone is driving — no second agent</text>

  <path class="arrow" d="M370 368 L 458 368" />

  <!-- legend -->
  <text class="small" x="30" y="470">solid = control / observation</text>
  <text class="small" x="30" y="488">accent = bearer credential handoff</text>
  <text class="small" x="30" y="506">(room link lives in memory only)</text>

  <!-- closing the browser note -->
  <rect class="box" x="30" y="180" width="340" height="96" />
  <text class="label" x="48" y="206">Closing Safari ≠ stopping an agent</text>
  <text class="small" x="48" y="228">The viewer detaches; the tmux session</text>
  <text class="small" x="48" y="244">keeps the agent working. Reopening</text>
  <text class="small" x="48" y="260">re-attaches to the same room.</text>
</svg>
